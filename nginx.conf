server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  # All Prima modules use one authentication origin. Blocks names its token
  # cookies by Origin, so using each module's host creates separate sessions.
  # The browser calls its own origin; nginx forwards only to the shared tenant.
  location /blocks-api/ {
    # A different site must not use this same-origin proxy to submit requests.
    if ($http_sec_fetch_site ~ "^(cross-site|same-site)$") { return 403; }

    proxy_pass https://blocksapi.slsblx.com/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    access_log off;
    proxy_ssl_name blocksapi.slsblx.com;
    proxy_set_header Host blocksapi.slsblx.com;
    proxy_set_header Origin https://dzvijs-esbol.slsblx.com;
    proxy_set_header Referer https://dzvijs-esbol.slsblx.com/;
    proxy_set_header X-Blocks-Key D589e5e2d1a43417591f07696cbf19477;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
